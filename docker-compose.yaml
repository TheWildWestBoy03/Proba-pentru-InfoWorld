version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 10s
      timeout: 3s
    volumes:
      - sqlserverdata:/var/opt/mssql
  sql_initializator:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_initializator
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    command: >
      bash -c '
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P YourStrong!Passw0rd -d master -i /docker-entrypoint-initdb.d/init.sql -C;
      echo "All done!";
      '
  adminer:
    image: adminer
    ports:
      - "8002:8080"
volumes:
  sqlserverdata: